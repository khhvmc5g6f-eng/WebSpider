[project]
name = "webspider"
version = "0.5.0"
description = "Polite web crawler with image discovery, structured text extraction, LLM summary cards, and source-faithful editorial revision with deterministic quality and integrity checks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "click>=8.1",
]

[project.optional-dependencies]
render = ["playwright>=1.40"]
images = ["Pillow>=10.0"]
text = ["trafilatura>=1.8", "extruct>=0.16"]
ai = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.scripts]
webspider = "webspider.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["webspider*"]
